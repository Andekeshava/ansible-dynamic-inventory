plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  instance-state-name: running
  "tag:Name": "roboshop-frontend"

hostnames:
  - private-ip-address

keyed_groups:
  - key: tags.Name

compose:
  ansible_host: private_ip_address

